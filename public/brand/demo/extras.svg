<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Святкові доповнення — демо-зображення">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe0ec"/>
      <stop offset="100%" stop-color="#ffb8cf"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- торт -->
  <g>
    <ellipse cx="400" cy="440" rx="180" ry="34" fill="#ffffff"/>
    <rect x="220" y="360" width="360" height="80" fill="#fff7ef" stroke="#e8c9a8" stroke-width="4"/>
    <rect x="255" y="300" width="290" height="60" fill="#fff7ef" stroke="#e8c9a8" stroke-width="4"/>
    <path d="M220 400 q45 26 90 0 q45 26 90 0 q45 26 90 0 q45 26 90 0" stroke="#e05c7a" stroke-width="10" fill="none"/>
    <!-- свічки -->
    <g>
      <rect x="330" y="250" width="12" height="50" fill="#4f86c6"/><rect x="394" y="242" width="12" height="58" fill="#f4b942"/><rect x="458" y="250" width="12" height="50" fill="#267765"/>
      <ellipse cx="336" cy="240" rx="8" ry="14" fill="#ffb347"/><ellipse cx="400" cy="232" rx="8" ry="14" fill="#ffb347"/><ellipse cx="464" cy="240" rx="8" ry="14" fill="#ffb347"/>
    </g>
  </g>
  <!-- кульки -->
  <g>
    <circle cx="180" cy="150" r="44" fill="#ff6b35"/><line x1="180" y1="194" x2="190" y2="330" stroke="#fff" stroke-width="3" opacity="0.7"/>
    <circle cx="620" cy="130" r="40" fill="#4f86c6"/><line x1="620" y1="170" x2="612" y2="330" stroke="#fff" stroke-width="3" opacity="0.7"/>
    <circle cx="690" cy="230" r="30" fill="#f4b942"/><line x1="690" y1="260" x2="670" y2="360" stroke="#fff" stroke-width="3" opacity="0.7"/>
  </g>
  <!-- конфетті -->
  <g fill="#ffffff" opacity="0.85">
    <rect x="300" y="120" width="10" height="16" rx="3" transform="rotate(25 305 128)"/>
    <rect x="480" y="140" width="10" height="16" rx="3" transform="rotate(-35 485 148)"/>
    <rect x="390" y="90" width="10" height="16" rx="3" transform="rotate(10 395 98)"/>
  </g>
  <text x="400" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#12343a">Святкові доповнення</text>
  <text x="400" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#496069">демо-зображення · замінити на реальне фото</text>
</svg>
