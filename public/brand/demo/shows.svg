<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Шоу-програми — демо-зображення">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b1d4e"/>
      <stop offset="100%" stop-color="#5b2a86"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#fff2b0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fff2b0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <polygon points="300,0 500,0 620,470 180,470" fill="url(#spot)"/>
  <!-- сцена -->
  <rect x="120" y="470" width="560" height="24" rx="8" fill="#12343a"/>
  <g>
    <circle cx="400" cy="300" r="34" fill="#ffe3c9"/>
    <path d="M366 330 h68 l18 130 h-104 z" fill="#e05c7a"/>
    <path d="M366 330 l-52 80 26 24 44 -60 z" fill="#e05c7a"/>
    <path d="M434 330 l52 80 -26 24 -44 -60 z" fill="#e05c7a"/>
    <path d="M392 260 q8 -22 30 -14" stroke="#12343a" stroke-width="6" fill="none"/>
    <!-- кульки -->
    <circle cx="250" cy="200" r="30" fill="#ff6b35"/><line x1="250" y1="230" x2="255" y2="330" stroke="#fff" stroke-width="2" opacity="0.6"/>
    <circle cx="560" cy="180" r="26" fill="#4f86c6"/><line x1="560" y1="206" x2="556" y2="320" stroke="#fff" stroke-width="2" opacity="0.6"/>
    <circle cx="620" cy="260" r="20" fill="#f4b942"/>
  </g>
  <!-- конфетті -->
  <g fill="#fff2b0">
    <rect x="180" y="120" width="10" height="16" rx="3" transform="rotate(20 185 128)"/>
    <rect x="330" y="80" width="10" height="16" rx="3" transform="rotate(-30 335 88)"/>
    <rect x="470" y="110" width="10" height="16" rx="3" transform="rotate(40 475 118)"/>
