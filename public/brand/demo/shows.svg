  <text x="400" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Шоу-програми</text>
  <text x="400" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#cdbde8">демо-зображення · замінити на реальне фото</text>
