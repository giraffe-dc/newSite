<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="VR і PlayStation — демо-зображення">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- неонова сітка -->
  <g stroke="#38f9d7" stroke-width="2" opacity="0.4">
    <line x1="0" y1="470" x2="800" y2="470"/><line x1="0" y1="510" x2="800" y2="510"/><line x1="0" y1="560" x2="800" y2="560"/>
    <line x1="400" y1="470" x2="140" y2="600"/><line x1="400" y1="470" x2="660" y2="600"/><line x1="400" y1="470" x2="300" y2="600"/><line x1="400" y1="470" x2="500" y2="600"/>
  </g>
  <!-- VR-окуляри -->
  <g>
    <rect x="270" y="200" width="260" height="130" rx="46" fill="#e8f4ff"/>
    <rect x="292" y="222" width="96" height="70" rx="26" fill="#1c221d"/>
    <rect x="412" y="222" width="96" height="70" rx="26" fill="#1c221d"/>
    <path d="M270 240 q-40 10 -50 60" stroke="#e8f4ff" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M530 240 q40 10 50 60" stroke="#e8f4ff" stroke-width="14" fill="none" stroke-linecap="round"/>
    <rect x="368" y="252" width="64" height="16" rx="8" fill="#38f9d7"/>
  </g>
  <!-- геймпад -->
  <g transform="translate(330 370)">
    <path d="M0 40 q0 -40 45 -40 h80 q45 0 45 40 q0 40 -45 40 h-80 q-45 0 -45 -40z" fill="#f2f5f7"/>
    <circle cx="40" cy="34" r="12" fill="#1c221d"/><circle cx="130" cy="34" r="12" fill="#ff6b35"/>
    <rect x="70" y="26" width="40" height="12" rx="6" fill="#267765"/>
  </g>
  <circle cx="640" cy="120" r="46" fill="none" stroke="#38f9d7" stroke-width="4" opacity="0.7"/>
  <circle cx="150" cy="150" r="30" fill="none" stroke="#ff6b35" stroke-width="4" opacity="0.7"/>
  <text x="400" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">VR &amp; PS4 · GAME PORTAL</text>
  <text x="400" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#8fb6c9">демо-зображення · замінити на реальне фото</text>
